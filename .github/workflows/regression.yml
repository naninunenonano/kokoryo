name: Game regression tests
on:
  push:
    branches: [main, feature/turn-chess-clock]
    paths: ['index.html', 'src/**', 'js/**', 'tools/**', 'packs/**', 'tests/**', 'package*.json', '.github/workflows/regression.yml']
  pull_request:
    paths: ['index.html', 'src/**', 'js/**', 'tools/**', 'packs/**', 'tests/**', 'package*.json', '.github/workflows/regression.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
